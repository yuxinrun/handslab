<text x="40" y="46" font-size="21" font-weight="800" fill="#0f172a">OpenHands 多仓库职责边界</text>
<text x="40" y="68" font-size="12" fill="#475569">把“界面、执行、调度、扩展”放进不同仓库，避免单体耦合</text>
