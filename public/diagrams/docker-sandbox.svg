<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="Docker Sandbox 安全边界" style="max-width:100%;height:auto">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e2e8f0" stroke-width="0.6"/></pattern></defs>
<rect width="980" height="540" fill="#f8fafc"/><rect width="980" height="540" fill="url(#grid)" opacity="0.75"/>
<text x="40" y="46" font-size="21" font-weight="800" fill="#0f172a">Docker Sandbox 安全边界</text>
<text x="40" y="68" font-size="12" fill="#475569">Agent Canvas 官方推荐：容器 uid 10001，只挂载必要 workspace</text>
<line x1="40" y1="80" x2="940" y2="80" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="40" y="110" width="900" height="360" rx="14" fill="#dbeafe" fill-opacity="0.28" stroke="#2563eb" stroke-opacity="0.5" stroke-dasharray="6 5"/><text x="54" y="132" font-size="12" font-weight="700" fill="#2563eb">Host / Docker Engine</text>
<rect x="100" y="170" width="780" height="260" rx="14" fill="#cffafe" fill-opacity="0.28" stroke="#0891b2" stroke-opacity="0.5" stroke-dasharray="6 5"/><text x="114" y="192" font-size="12" font-weight="700" fill="#0891b2">Container（独立 Agent Server）</text>
<path d="M 340 257 L 390 257" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 240 294 L 240 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 490 294 L 490 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 590 367 L 640 367" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="584" y="345" width="62" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="615" y="359" font-size="11" fill="#475569" text-anchor="middle">按需注入</text>
<rect x="140" y="220" width="200" height="74" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="140" y="220" width="4" height="74" rx="2" fill="#2563eb"/><text x="240" y="254" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Agent Server</text><text x="240" y="272" font-size="10.5" fill="#475569" text-anchor="middle">/alive 健康检查</text>
<rect x="390" y="220" width="200" height="74" rx="11" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><rect x="390" y="220" width="4" height="74" rx="2" fill="#059669"/><text x="490" y="254" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Workspace</text><text x="490" y="272" font-size="10.5" fill="#475569" text-anchor="middle">/projects 挂载目录</text>
<rect x="140" y="330" width="200" height="74" rx="11" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/><rect x="140" y="330" width="4" height="74" rx="2" fill="#0891b2"/><text x="240" y="364" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">File System</text><text x="240" y="382" font-size="10.5" fill="#475569" text-anchor="middle">容器内隔离视图</text>
<rect x="390" y="330" width="200" height="74" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><rect x="390" y="330" width="4" height="74" rx="2" fill="#d97706"/><text x="490" y="364" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Network</text><text x="490" y="382" font-size="10.5" fill="#475569" text-anchor="middle">默认受限出口</text>
<rect x="640" y="330" width="180" height="74" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><rect x="640" y="330" width="4" height="74" rx="2" fill="#dc2626"/><text x="730" y="364" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Secrets</text><text x="730" y="382" font-size="10.5" fill="#475569" text-anchor="middle">环境变量 / 卷</text>
<g transform="translate(40,497)"><text x="0" y="0" font-size="11.5" fill="#475569">• 宿主机目录权限需授权 uid 10001 读写</text><text x="0" y="17" font-size="11.5" fill="#475569">• /alive 约 30 秒无响应则容器退出，便于显式恢复</text></g>
</svg>