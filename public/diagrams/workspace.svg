<rect x="790" y="270" width="150" height="82" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><rect x="790" y="270" width="4" height="82" rx="2" fill="#d97706"/><text x="865" y="308" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">RemoteWorkspace</text><text x="865" y="326" font-size="10.5" fill="#475569" text-anchor="middle">基础远程类</text>
