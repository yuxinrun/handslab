<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-label="Mini Coding Agent 教学架构" style="max-width:100%;height:auto">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e2e8f0" stroke-width="0.6"/></pattern></defs>
<rect width="980" height="500" fill="#f8fafc"/><rect width="980" height="500" fill="url(#grid)" opacity="0.75"/>
<text x="40" y="46" font-size="21" font-weight="800" fill="#0f172a">Mini Coding Agent 教学架构</text>
<text x="40" y="68" font-size="12" fill="#475569">用最小依赖复刻 Agent Loop 的核心机制</text>
<line x1="40" y1="80" x2="940" y2="80" stroke="#e2e8f0" stroke-width="1.5"/>

<path d="M 230 178 L 280 178" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 450 178 L 500 178" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 670 178 L 720 178" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 805 216 L 365 310" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="554" y="241" width="62" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="585" y="255" font-size="11" fill="#475569" text-anchor="middle">结果回填</text>
<path d="M 585 216 L 585 310" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="554" y="241" width="62" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="585" y="255" font-size="11" fill="#475569" text-anchor="middle">文件操作</text>
<path d="M 365 348 L 365 400 L 280 400 L 280 386" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="300" y="378" width="50" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="325" y="392" font-size="11" fill="#475569" text-anchor="middle">下一轮</text>
<rect x="60" y="140" width="170" height="76" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="60" y="140" width="4" height="76" rx="2" fill="#2563eb"/><text x="145" y="175" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">CLI 输入</text><text x="145" y="193" font-size="10.5" fill="#475569" text-anchor="middle">用户任务</text>
<rect x="280" y="140" width="170" height="76" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><rect x="280" y="140" width="4" height="76" rx="2" fill="#7c3aed"/><text x="365" y="175" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Loop</text><text x="365" y="193" font-size="10.5" fill="#475569" text-anchor="middle">最多 N 轮</text>
<rect x="500" y="140" width="170" height="76" rx="11" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/><rect x="500" y="140" width="4" height="76" rx="2" fill="#0891b2"/><text x="585" y="175" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">LLM</text><text x="585" y="193" font-size="10.5" fill="#475569" text-anchor="middle">返回 JSON Action</text>
<rect x="720" y="140" width="170" height="76" rx="11" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><rect x="720" y="140" width="4" height="76" rx="2" fill="#059669"/><text x="805" y="175" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Tools</text><text x="805" y="193" font-size="10.5" fill="#475569" text-anchor="middle">read / write / shell</text>
<rect x="280" y="310" width="170" height="76" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><rect x="280" y="310" width="4" height="76" rx="2" fill="#d97706"/><text x="365" y="345" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Observation</text><text x="365" y="363" font-size="10.5" fill="#475569" text-anchor="middle">文本结果</text>
<rect x="500" y="310" width="170" height="76" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="500" y="310" width="4" height="76" rx="2" fill="#2563eb"/><text x="585" y="345" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Workspace</text><text x="585" y="363" font-size="10.5" fill="#475569" text-anchor="middle">限定 working_dir</text>
<g transform="translate(40,457)"><text x="0" y="0" font-size="11.5" fill="#475569">• 教学实现，不是 OpenHands 官方源码</text><text x="0" y="17" font-size="11.5" fill="#475569">• 重点理解契约与边界，而非追求功能完整</text></g>
</svg>