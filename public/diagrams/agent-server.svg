<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="Agent Server 架构" style="max-width:100%;height:auto">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e2e8f0" stroke-width="0.6"/></pattern></defs>
<rect width="980" height="540" fill="#f8fafc"/><rect width="980" height="540" fill="url(#grid)" opacity="0.75"/>
<text x="40" y="46" font-size="21" font-weight="800" fill="#0f172a">Agent Server 架构</text>
<text x="40" y="68" font-size="12" fill="#475569">FastAPI HTTP/WebSocket 服务，隔离应用后端与 Agent 执行环境</text>
<line x1="40" y1="80" x2="940" y2="80" stroke="#e2e8f0" stroke-width="1.5"/>

<path d="M 210 178 L 250 178" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 440 178 L 480 178" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 670 178 L 710 178" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 345 216 L 345 300" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="326" y="236" width="38" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="345" y="250" font-size="11" fill="#475569" text-anchor="middle">鉴权</text>
<path d="M 575 216 L 575 300" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 805 216 L 805 300" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="780" y="236" width="50" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="805" y="250" font-size="11" fill="#475569" text-anchor="middle">持久化</text>
<path d="M 670 338 L 440 338" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="524" y="316" width="62" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="555" y="330" font-size="11" fill="#475569" text-anchor="middle">工具读写</text>
<rect x="40" y="140" width="170" height="76" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="40" y="140" width="4" height="76" rx="2" fill="#2563eb"/><text x="125" y="175" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Clients</text><text x="125" y="193" font-size="10.5" fill="#475569" text-anchor="middle">Canvas / CLI / 自定义</text>
<rect x="250" y="140" width="190" height="76" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><rect x="250" y="140" width="4" height="76" rx="2" fill="#7c3aed"/><text x="345" y="175" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">API Layer</text><text x="345" y="193" font-size="10.5" fill="#475569" text-anchor="middle">REST + WebSocket</text><text x="345" y="207" font-size="10.5" fill="#475569" text-anchor="middle">/api/* · /server_info</text>
<rect x="480" y="140" width="190" height="76" rx="11" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/><rect x="480" y="140" width="4" height="76" rx="2" fill="#0891b2"/><text x="575" y="175" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Conversation</text><text x="575" y="193" font-size="10.5" fill="#475569" text-anchor="middle">生命周期 · 事件流</text>
<rect x="710" y="140" width="190" height="76" rx="11" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><rect x="710" y="140" width="4" height="76" rx="2" fill="#059669"/><text x="805" y="175" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">SDK Agent</text><text x="805" y="193" font-size="10.5" fill="#475569" text-anchor="middle">LLM + Tools</text>
<rect x="250" y="300" width="190" height="76" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><rect x="250" y="300" width="4" height="76" rx="2" fill="#dc2626"/><text x="345" y="335" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Auth</text><text x="345" y="353" font-size="10.5" fill="#475569" text-anchor="middle">X-Session-API-Key</text>
<rect x="480" y="300" width="190" height="76" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><rect x="480" y="300" width="4" height="76" rx="2" fill="#d97706"/><text x="575" y="335" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Workspace</text><text x="575" y="353" font-size="10.5" fill="#475569" text-anchor="middle">文件 / Bash / Git</text>
<rect x="710" y="300" width="190" height="76" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="710" y="300" width="4" height="76" rx="2" fill="#2563eb"/><text x="805" y="335" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Storage</text><text x="805" y="353" font-size="10.5" fill="#475569" text-anchor="middle">workspace/conversations</text>
<g transform="translate(40,514)"><text x="0" y="0" font-size="11.5" fill="#475569">• 默认无鉴权；对外暴露必须设置 OH_SESSION_API_KEYS_* 与 OH_SECRET_KEY</text></g>
</svg>