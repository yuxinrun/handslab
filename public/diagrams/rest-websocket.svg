<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-label="REST 与 WebSocket 通信模型" style="max-width:100%;height:auto">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e2e8f0" stroke-width="0.6"/></pattern></defs>
<rect width="980" height="500" fill="#f8fafc"/><rect width="980" height="500" fill="url(#grid)" opacity="0.75"/>
<text x="40" y="46" font-size="21" font-weight="800" fill="#0f172a">REST 与 WebSocket 通信模型</text>
<text x="40" y="68" font-size="12" fill="#475569">命令走 REST，状态与事件走流式通道</text>
<line x1="40" y1="80" x2="940" y2="80" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="60" y="120" width="370" height="300" rx="14" fill="#dbeafe" fill-opacity="0.28" stroke="#2563eb" stroke-opacity="0.5" stroke-dasharray="6 5"/><text x="74" y="142" font-size="12" font-weight="700" fill="#2563eb">REST：请求 / 响应</text>
<rect x="550" y="120" width="370" height="300" rx="14" fill="#cffafe" fill-opacity="0.28" stroke="#0891b2" stroke-opacity="0.5" stroke-dasharray="6 5"/><text x="564" y="142" font-size="12" font-weight="700" fill="#0891b2">WebSocket：事件流</text>
<path d="M 220 203 L 280 203" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="231" y="181" width="38" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="250" y="195" font-size="11" fill="#475569" text-anchor="middle">请求</text>
<path d="M 345 236 L 155 290" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="231" y="241" width="38" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="250" y="255" font-size="11" fill="#475569" text-anchor="middle">返回</text>
<path d="M 710 203 L 790 203" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 845 236 L 645 290" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="702" y="241" width="86" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="745" y="255" font-size="11" fill="#475569" text-anchor="middle">stream</text>
<path d="M 710 323 L 790 323" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="731" y="301" width="38" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="750" y="315" font-size="11" fill="#475569" text-anchor="middle">渲染</text>
<rect x="90" y="170" width="130" height="66" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="90" y="170" width="4" height="66" rx="2" fill="#2563eb"/><text x="155" y="200" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text><text x="155" y="218" font-size="10.5" fill="#475569" text-anchor="middle">POST /api/...</text>
<rect x="280" y="170" width="130" height="66" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><rect x="280" y="170" width="4" height="66" rx="2" fill="#7c3aed"/><text x="345" y="200" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Agent Server</text><text x="345" y="218" font-size="10.5" fill="#475569" text-anchor="middle">处理请求</text>
<rect x="90" y="290" width="130" height="66" rx="11" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><rect x="90" y="290" width="4" height="66" rx="2" fill="#059669"/><text x="155" y="320" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">响应</text><text x="155" y="338" font-size="10.5" fill="#475569" text-anchor="middle">JSON 结果</text>
<rect x="580" y="170" width="130" height="66" rx="11" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/><rect x="580" y="170" width="4" height="66" rx="2" fill="#0891b2"/><text x="645" y="200" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text><text x="645" y="218" font-size="10.5" fill="#475569" text-anchor="middle">订阅事件</text>
<rect x="790" y="170" width="110" height="66" rx="11" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/><rect x="790" y="170" width="4" height="66" rx="2" fill="#0891b2"/><text x="845" y="200" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Server</text><text x="845" y="218" font-size="10.5" fill="#475569" text-anchor="middle">推送</text>
<rect x="580" y="290" width="130" height="66" rx="11" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><rect x="580" y="290" width="4" height="66" rx="2" fill="#059669"/><text x="645" y="320" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">UI 状态</text><text x="645" y="338" font-size="10.5" fill="#475569" text-anchor="middle">实时更新</text>
<rect x="790" y="290" width="110" height="66" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><rect x="790" y="290" width="4" height="66" rx="2" fill="#d97706"/><text x="845" y="320" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Events</text><text x="845" y="338" font-size="10.5" fill="#475569" text-anchor="middle">action / observation</text>
<g transform="translate(40,474)"><text x="0" y="0" font-size="11.5" fill="#475569">• 具体 WebSocket 路由以官方 OpenAPI / 源码为准，本文不臆测路径</text></g>
</svg>