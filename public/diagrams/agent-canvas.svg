<rect x="530" y="130" width="180" height="74" rx="11" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/><rect x="530" y="130" width="4" height="74" rx="2" fill="#0891b2"/><text x="620" y="164" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">API 适配器</text><text x="620" y="182" font-size="10.5" fill="#475569" text-anchor="middle">src/api/ 服务封装</text>
