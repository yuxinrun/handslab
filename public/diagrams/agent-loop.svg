<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="Agent Loop：推理—行动—观察循环" style="max-width:100%;height:auto">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e2e8f0" stroke-width="0.6"/></pattern></defs>
<rect width="980" height="520" fill="#f8fafc"/><rect width="980" height="520" fill="url(#grid)" opacity="0.75"/>
<text x="40" y="46" font-size="21" font-weight="800" fill="#0f172a">Agent Loop：推理—行动—观察循环</text>
<text x="40" y="68" font-size="12" fill="#475569">Agent 调用 LLM 决策，通过 Tool 执行 Action，再用 Observation 进入下一轮</text>
<line x1="40" y1="80" x2="940" y2="80" stroke="#e2e8f0" stroke-width="1.5"/>

<path d="M 190 188 L 230 188" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 380 188 L 420 188" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 570 188 L 610 188" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 760 188 L 790 188" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 685 226 L 685 290 L 305 290 L 305 226" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="464" y="268" width="62" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="495" y="282" font-size="11" fill="#475569" text-anchor="middle">继续推理</text>
<rect x="40" y="150" width="150" height="76" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><rect x="40" y="150" width="4" height="76" rx="2" fill="#2563eb"/><text x="115" y="185" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">User Task</text><text x="115" y="203" font-size="10.5" fill="#475569" text-anchor="middle">用户目标</text>
<rect x="230" y="150" width="150" height="76" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><rect x="230" y="150" width="4" height="76" rx="2" fill="#7c3aed"/><text x="305" y="185" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">LLM Decision</text><text x="305" y="203" font-size="10.5" fill="#475569" text-anchor="middle">下一步做什么</text>
<rect x="420" y="150" width="150" height="76" rx="11" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/><rect x="420" y="150" width="4" height="76" rx="2" fill="#0891b2"/><text x="495" y="185" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Tool Call</text><text x="495" y="203" font-size="10.5" fill="#475569" text-anchor="middle">执行 Action</text>
<rect x="610" y="150" width="150" height="76" rx="11" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><rect x="610" y="150" width="4" height="76" rx="2" fill="#059669"/><text x="685" y="185" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Observation</text><text x="685" y="203" font-size="10.5" fill="#475569" text-anchor="middle">返回结果</text>
<rect x="790" y="150" width="150" height="76" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><rect x="790" y="150" width="4" height="76" rx="2" fill="#d97706"/><text x="865" y="185" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Final Answer</text><text x="865" y="203" font-size="10.5" fill="#475569" text-anchor="middle">任务完成</text>
<g transform="translate(40,477)"><text x="0" y="0" font-size="11.5" fill="#475569">• 循环终止由 LLM 表达“完成”或外部停止条件决定</text><text x="0" y="17" font-size="11.5" fill="#475569">• 每一轮都会产生事件，供 UI 与日志消费</text></g>
</svg>