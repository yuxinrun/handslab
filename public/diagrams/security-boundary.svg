<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="Coding Agent 安全边界" style="max-width:100%;height:auto">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e2e8f0" stroke-width="0.6"/></pattern></defs>
<rect width="980" height="540" fill="#f8fafc"/><rect width="980" height="540" fill="url(#grid)" opacity="0.75"/>
<text x="40" y="46" font-size="21" font-weight="800" fill="#0f172a">Coding Agent 安全边界</text>
<text x="40" y="68" font-size="12" fill="#475569">每一层都应默认最小权限</text>
<line x1="40" y1="80" x2="940" y2="80" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="40" y="110" width="900" height="360" rx="14" fill="#fee2e2" fill-opacity="0.28" stroke="#dc2626" stroke-opacity="0.5" stroke-dasharray="6 5"/><text x="54" y="132" font-size="12" font-weight="700" fill="#dc2626">Host（宿主机：用户数据与密钥）</text>
<rect x="100" y="170" width="780" height="260" rx="14" fill="#fef3c7" fill-opacity="0.28" stroke="#d97706" stroke-opacity="0.5" stroke-dasharray="6 5"/><text x="114" y="192" font-size="12" font-weight="700" fill="#d97706">Container（Agent 执行环境）</text>
<rect x="160" y="220" width="660" height="170" rx="14" fill="#d1fae5" fill-opacity="0.28" stroke="#059669" stroke-opacity="0.5" stroke-dasharray="6 5"/><text x="174" y="242" font-size="12" font-weight="700" fill="#059669">Workspace（仅挂载必要目录）</text>
<path d="M 370 290 L 410 290" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="371" y="268" width="38" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="390" y="282" font-size="11" fill="#475569" text-anchor="middle">执行</text>
<path d="M 590 290 L 630 290" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="591" y="268" width="38" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="610" y="282" font-size="11" fill="#475569" text-anchor="middle">访问</text>
<path d="M 280 170 L 280 120" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="269" y="131" width="62" height="20" rx="6" fill="#f8fafc" opacity="0.96"/><text x="300" y="145" font-size="11" fill="#475569" text-anchor="middle">显式挂载</text>
<rect x="190" y="260" width="180" height="60" rx="11" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/><rect x="190" y="260" width="4" height="60" rx="2" fill="#059669"/><text x="280" y="287" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">File System</text><text x="280" y="305" font-size="10.5" fill="#475569" text-anchor="middle">读写受控目录</text>
<rect x="410" y="260" width="180" height="60" rx="11" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><rect x="410" y="260" width="4" height="60" rx="2" fill="#dc2626"/><text x="500" y="287" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Command</text><text x="500" y="305" font-size="10.5" fill="#475569" text-anchor="middle">命令风险</text>
<rect x="630" y="260" width="150" height="60" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><rect x="630" y="260" width="4" height="60" rx="2" fill="#d97706"/><text x="705" y="287" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Network</text><text x="705" y="305" font-size="10.5" fill="#475569" text-anchor="middle">出口限制</text>
<g transform="translate(40,497)"><text x="0" y="0" font-size="11.5" fill="#475569">• 绝不默认把宿主机 root 权限交给 Agent</text><text x="0" y="17" font-size="11.5" fill="#475569">• Prompt Injection 与恶意仓库内容是独立威胁面</text></g>
</svg>