<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="HandsLab Agent 执行循环主视觉" style="max-width:100%;height:auto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1730"/><stop offset="0.55" stop-color="#0a1022"/><stop offset="1" stop-color="#10102a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#243053" stroke-width="0.7" opacity="0.7"/></pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c93c4"/></marker>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/></marker>
  </defs>
  <rect width="880" height="520" rx="18" fill="url(#bg)"/>
  <rect width="880" height="520" rx="18" fill="url(#grid)" opacity="0.5"/>
  <circle cx="180" cy="130" r="150" fill="url(#glow)"/>
  <circle cx="720" cy="400" r="160" fill="url(#glow)" opacity="0.6"/>
  <text x="36" y="44" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#6f86b5">AGENT EXECUTION LOOP</text>
  <text x="36" y="70" font-family="sans-serif" font-size="20" font-weight="800" fill="#e8efff">从任务到答案的每一步都可观察</text>

  <g font-family="sans-serif" text-anchor="middle">
    <rect x="36" y="118" width="176" height="72" rx="13" fill="#152342" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="124" y="150" font-size="15" font-weight="800" fill="#e8efff">User Task</text>
    <text x="124" y="170" font-size="11" fill="#93a7c9">用户目标 / Issue</text>

    <rect x="252" y="118" width="176" height="72" rx="13" fill="#1b1a3d" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="340" y="150" font-size="15" font-weight="800" fill="#e8efff">LLM Decision</text>
    <text x="340" y="170" font-size="11" fill="#a99dd6">下一步做什么？</text>

    <rect x="468" y="118" width="176" height="72" rx="13" fill="#122a3c" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="556" y="150" font-size="15" font-weight="800" fill="#e8efff">Tool Call</text>
    <text x="556" y="170" font-size="11" fill="#8dc7d8">Action · Schema</text>

    <rect x="684" y="118" width="160" height="72" rx="13" fill="#142a2b" stroke="#10b981" stroke-width="1.5"/>
    <text x="764" y="150" font-size="15" font-weight="800" fill="#e8efff">Observation</text>
    <text x="764" y="170" font-size="11" fill="#8fc9b4">结果 / 错误</text>
  </g>

  <path d="M 212 154 L 250 154" fill="none" stroke="url(#line)" stroke-width="2.4" marker-end="url(#arw)"/>
  <path d="M 428 154 L 466 154" fill="none" stroke="url(#line)" stroke-width="2.4" marker-end="url(#arw)"/>
  <path d="M 644 154 L 682 154" fill="none" stroke="url(#line)" stroke-width="2.4" marker-end="url(#arw)"/>
  <path d="M 764 190 L 764 252 L 340 252 L 340 192" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arw2)"/>
  <rect x="524" y="240" width="112" height="22" rx="6" fill="#0d1730"/>
  <text x="580" y="255" font-family="sans-serif" font-size="11" fill="#b6a7ea" text-anchor="middle">继续推理（下一轮）</text>

  <g font-family="sans-serif" text-anchor="middle">
    <rect x="330" y="330" width="220" height="68" rx="13" fill="#1b1a3d" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="440" y="359" font-size="15" font-weight="800" fill="#e8efff">Final Answer</text>
    <text x="440" y="379" font-size="11" fill="#a99dd6">任务完成 · 状态更新</text>

    <rect x="596" y="330" width="220" height="68" rx="13" fill="#152342" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="706" y="359" font-size="15" font-weight="800" fill="#e8efff">Workspace</text>
    <text x="706" y="379" font-size="11" fill="#93a7c9">Local / Docker / Remote</text>
  </g>
  <path d="M 556 190 L 556 300 L 440 300 L 440 328" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M 644 154 L 706 300" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arw)"/>

  <rect x="36" y="438" width="780" height="44" rx="11" fill="#101d38" stroke="#26345a"/>
  <circle cx="62" cy="460" r="5" fill="#34d399"/>
  <text x="80" y="465" font-family="sans-serif" font-size="12" fill="#9fb2d4">Event Stream</text>
  <text x="180" y="465" font-family="monospace" font-size="11" fill="#7b93bf">ConversationStarted · ActionRequested · ObservationReceived · ConversationFinished</text>
  <text x="790" y="465" font-family="sans-serif" font-size="11" fill="#6f86b5" text-anchor="end">UI / Logs</text>
</svg>
